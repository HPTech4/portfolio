<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Illustration of the CBT Center timed exam screen">
  <title>CBT Center timed exam screen</title>

  <!--
    Authored illustration, not a screenshot capture. Drawn in the site's own
    light-theme palette so it reads as part of the design system rather than
    as a photograph of the product. Replace with a real screenshot when one
    is available — see README, "Images".
  -->

  <defs>
    <style>
      .ui { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; }
      .meta { font-size: 13px; }
      .q { font-size: 21px; font-weight: 500; }
      .opt { font-size: 15px; }
      .num { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#FAF8F4" />

  <!-- ============================ App bar ============================ -->
  <rect width="1200" height="64" fill="#FFFFFF" />
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#E5E1D8" stroke-width="1" />

  <rect x="48" y="20" width="24" height="24" rx="7" fill="#1F4D3A" />
  <path d="M55 32.5 58.5 27 62 32.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="ui" x="84" y="37" font-size="16" font-weight="600" fill="#1C1A17">Prime Scholar</text>

  <text class="ui meta" x="1012" y="37" fill="#6B6862">Tunde A.</text>
  <circle cx="1132" cy="32" r="16" fill="#F2EFE8" stroke="#E5E1D8" />
  <circle cx="1132" cy="27" r="5" fill="#6B6862" />
  <path d="M1123 43a9 9 0 0 1 18 0z" fill="#6B6862" />

  <!-- ========================== Exam paper =========================== -->
  <rect x="48" y="96" width="728" height="456" rx="10" fill="#FFFFFF" stroke="#E5E1D8" />

  <text class="ui label" x="88" y="142" fill="#6B6862">QUESTION 7 OF 40</text>

  <!-- Countdown chip -->
  <rect x="616" y="116" width="120" height="36" rx="18" fill="#F2EFE8" />
  <circle cx="639" cy="134" r="8" fill="none" stroke="#1F4D3A" stroke-width="1.8" />
  <path d="M639 129.5v4.5l3 2" fill="none" stroke="#1F4D3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <text class="ui" x="656" y="139" font-size="15" font-weight="600" fill="#1F4D3A">12:45</text>

  <text class="ui q" x="88" y="196" fill="#1C1A17">A car travels 150 km in 2 hours. What</text>
  <text class="ui q" x="88" y="226" fill="#1C1A17">is its average speed?</text>

  <!-- Options: B is selected -->
  <rect x="88" y="250" width="648" height="50" rx="8" fill="#FFFFFF" stroke="#E5E1D8" />
  <circle cx="118" cy="275" r="9" fill="none" stroke="#6B6862" stroke-width="1.6" />
  <text class="ui opt" x="146" y="281" fill="#1C1A17">A. 60 km/h</text>

  <rect x="88" y="310" width="648" height="50" rx="8" fill="#F2EFE8" stroke="#1F4D3A" stroke-width="1.6" />
  <circle cx="118" cy="335" r="9" fill="#1F4D3A" />
  <circle cx="118" cy="335" r="3.5" fill="#FFFFFF" />
  <text class="ui opt" x="146" y="341" fill="#1C1A17" font-weight="500">B. 75 km/h</text>

  <rect x="88" y="370" width="648" height="50" rx="8" fill="#FFFFFF" stroke="#E5E1D8" />
  <circle cx="118" cy="395" r="9" fill="none" stroke="#6B6862" stroke-width="1.6" />
  <text class="ui opt" x="146" y="401" fill="#1C1A17">C. 100 km/h</text>

  <rect x="88" y="430" width="648" height="50" rx="8" fill="#FFFFFF" stroke="#E5E1D8" />
  <circle cx="118" cy="455" r="9" fill="none" stroke="#6B6862" stroke-width="1.6" />
  <text class="ui opt" x="146" y="461" fill="#1C1A17">D. 150 km/h</text>

  <!-- Navigation -->
  <rect x="88" y="496" width="118" height="44" rx="8" fill="#FFFFFF" stroke="#E5E1D8" />
  <text class="ui" x="147" y="524" font-size="14" font-weight="500" fill="#6B6862" text-anchor="middle">Previous</text>

  <rect x="618" y="496" width="118" height="44" rx="8" fill="#1F4D3A" />
  <text class="ui" x="677" y="524" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Next</text>

  <!-- ======================= Question palette ======================== -->
