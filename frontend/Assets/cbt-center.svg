  <rect x="1012" y="160" width="40" height="32" rx="6" fill="#1F4D3A" /><text class="ui num" x="1032" y="176" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="1072" y="160" width="40" height="32" rx="6" fill="#1F4D3A" /><text class="ui num" x="1092" y="176" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5</text>

